<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的中文网站</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;

            color: #1f2937;
            background: #f5f7fb;
            line-height: 1.8;
        }

        /* ===== 顶部 ===== */

        header {
            background:
                linear-gradient(135deg, #111827, #312e81, #4f46e5);

            color: white;
            padding: 70px 20px 90px;
        }

        .header-content {
            max-width: 1000px;
            margin: auto;
        }

        .site-name {
            font-size: 18px;
            font-weight: 600;
            opacity: 0.85;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: clamp(38px, 8vw, 68px);
            line-height: 1.15;
            letter-spacing: -2px;
        }

        header p {
            margin-top: 22px;
            max-width: 650px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.82);
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 11px 22px;
            border-radius: 999px;
            background: white;
            color: #3730a3;
            text-decoration: none;
            font-weight: 600;
            transition: 0.25s;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        /* ===== 主体 ===== */

        main {
            max-width: 1000px;
            margin: -40px auto 0;
            padding: 0 20px 60px;
            position: relative;
        }

        /* ===== 文章区域 ===== */

        .section-title {
            font-size: 26px;
            margin: 0 0 20px;
        }

        .articles {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .article {
            background: white;
            padding: 28px;
            border-radius: 18px;

            box-shadow:
                0 8px 30px rgba(15, 23, 42, 0.06);

            transition: 0.25s;
        }

        .article:hover {
            transform: translateY(-5px);

            box-shadow:
                0 15px 35px rgba(15, 23, 42, 0.1);
        }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;

            background: #eef2ff;
            color: #4338ca;

            font-size: 13px;
            font-weight: 600;
        }

        .article h3 {
            margin: 15px 0 8px;
            font-size: 22px;
        }

        .article h3 a {
            color: #111827;
            text-decoration: none;
        }

        .article h3 a:hover {
            color: #4f46e5;
        }

        .date {
            color: #9ca3af;
            font-size: 14px;
        }

        .article p {
            color: #6b7280;
        }

        .read-more {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        /* ===== 关于我 ===== */

        .about {
            margin-top: 35px;
            padding: 35px;

            background: white;
            border-radius: 18px;

            box-shadow:
                0 8px 30px rgba(15, 23, 42, 0.06);
        }

        .about h2 {
            margin-top: 0;
        }

        .about p {
            color: #6b7280;
        }

        /* ===== 页脚 ===== */

        footer {
            text-align: center;
            padding: 35px 20px;

            color: #9ca3af;
            font-size: 14px;
        }

        /* ===== 手机端 ===== */

        @media (max-width: 700px) {

            header {
                padding: 55px 20px 75px;
            }

            header h1 {
                letter-spacing: -1px;
            }

            header p {
                font-size: 16px;
            }

            .articles {
                grid-template-columns: 1fr;
            }

            main {
                margin-top: -30px;
            }

            .article,
            .about {
                padding: 24px;
            }
        }
    </style>
</head>


<body>
