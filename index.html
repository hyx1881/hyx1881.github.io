<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="HYX1881 的个人中文网站">

    <title>HYX1881 · 我的中文网站</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;

            background: #f5f7fb;
            color: #1f2937;

            line-height: 1.8;
        }


        /* =========================
           顶部 Hero
        ========================= */

        .hero {
            background:
                linear-gradient(
                    135deg,
                    #111827 0%,
                    #312e81 50%,
                    #4f46e5 100%
                );

            color: white;

            padding: 70px 20px 85px;
        }

        .hero-inner {
            width: 100%;
            max-width: 1000px;

            margin: 0 auto;
        }

        .logo {
            font-size: 15px;
            font-weight: 700;

            letter-spacing: 2px;

            color: rgba(255,255,255,0.75);

            margin-bottom: 22px;
        }

        .hero h1 {
            margin: 0;

            font-size: 48px;

            line-height: 1.25;

            letter-spacing: -1px;
        }

        .hero-description {
            max-width: 650px;

            margin-top: 22px;

            font-size: 18px;

            color: rgba(255,255,255,0.82);
        }

        .hero-button {
            display: inline-block;

            margin-top: 28px;

            padding: 11px 22px;

            border-radius: 999px;

            background: white;

            color: #3730a3;

            text-decoration: none;

            font-weight: 700;

            transition: 0.25s;
        }

        .hero-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.2);
        }


        /* =========================
           主体
        ========================= */

        .main {
            width: 100%;
            max-width: 1000px;

            margin: 0 auto;

            padding: 45px 20px 70px;
        }


        /* =========================
           标题
        ========================= */

        .section-title {
            margin: 0 0 22px;

            font-size: 28px;

            color: #111827;
        }


        /* =========================
           文章列表
        ========================= */

        .articles {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 22px;
        }


        /* =========================
           文章卡片
        ========================= */

        .article-card {
            display: block;

            width: 100%;

            background: white;

            padding: 28px;

            border-radius: 18px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 8px 25px rgba(15,23,42,0.05);

            transition:
                transform 0.25s,
                box-shadow 0.25s;
        }

        .article-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 15px 35px rgba(15,23,42,0.1);
        }


        /* =========================
           标签
        ========================= */

        .tag {
            display: inline-block;

            padding: 4px 11px;

            border-radius: 999px;

            background: #eef2ff;

            color: #4338ca;

            font-size: 13px;

            font-weight: 700;
        }


        /* =========================
           文章标题
        ========================= */

        .article-title {
            margin: 14px 0 5px;

            font-size: 22px;

            line-height: 1.4;

            color: #111827;
        }


        /* =========================
           日期
        ========================= */

        .date {
            font-size: 14px;

            color: #9ca3af;
        }


        /* =========================
           文章简介
        ========================= */

        .article-text {
            margin-top: 15px;

            color: #6b7280;

            font-size: 16px;
        }


        /* =========================
           阅读更多
        ========================= */

        .read-more {
            display: inline-block;

            margin-top: 10px;

            color: #4f46e5;

            font-weight: 700;

            text-decoration: none;
        }

        .read-more:hover {
            text-decoration: underline;
        }


        /* =========================
           关于我
        ========================= */

        .about {
            margin-top: 40px;

            padding: 30px;

            background: white;

            border-radius: 18px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 8px 25px rgba(15,23,42,0.05);
        }

        .about h2 {
            margin-top: 0;

            font-size: 25px;
        }

        .about p {
            margin-bottom: 0;

            color: #6b7280;
        }


        /* =========================
           页脚
        ========================= */

        footer {
            text-align: center;

            padding: 35px 20px;

            color: #9ca3af;

            font-size: 14px;
        }


        /* =========================
           手机适配
        ========================= */

        @media (max-width: 700px) {

            .hero {
                padding:
                    55px
                    20px
                    65px;
            }

            .hero h1 {
                font-size: 40px;
            }

            .hero-description {
                font-size: 16px;
            }

            .main {
                padding:
                    35px
                    16px
                    50px;
            }

            .section-title {
                font-size: 25px;
            }

            .articles {
                grid-template-columns: 1fr;
            }

            .article-card {
                padding: 24px;
            }

            .about {
                padding: 24px;
            }
        }


        /* =========================
           更小的手机
        ========================= */

        @media (max-width: 380px) {

            .hero h1 {
                font-size: 34px;
            }

            .hero-description {
                font-size: 15px;
            }

            .article-title {
                font-size: 20px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         顶部
    ========================= -->

    <header class="hero">

        <div class="hero-inner">

            <div class="logo">
                HYX1881 · PERSONAL WEBSITE
            </div>

            <h1>
                我的中文网站
            </h1>

            <p class="hero-description">
                记录生活，分享想法，
                保存值得留下的文字。
