<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="我的第一篇文章">

    <title>我的第一篇文章 · HYX1881</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;

            background: #f5f7fb;
            color: #1f2937;

            line-height: 1.9;
        }

        .top {
            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #312e81,
                    #4f46e5
                );

            color: white;

            padding: 35px 20px;
        }

        .top-inner {
            max-width: 800px;
            margin: 0 auto;
        }

        .site-name {
            font-size: 15px;
            letter-spacing: 2px;
            opacity: 0.75;
        }

        .back {
            display: inline-block;

            margin-top: 20px;

            color: white;
            text-decoration: none;

            font-size: 15px;
        }

        .article {
            max-width: 800px;

            margin: 40px auto;

            padding: 0 20px;
        }

        .article-box {
            background: white;

            padding: 40px;

            border-radius: 20px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 10px 30px rgba(15,23,42,0.06);
        }

        .tag {
            display: inline-block;

            padding: 5px 12px;

            border-radius: 999px;

            background: #eef2ff;

            color: #4338ca;

            font-size: 13px;

            font-weight: 700;
        }

        h1 {
            margin: 18px 0 8px;

            font-size: 38px;

            line-height: 1.4;
        }

        .date {
            color: #9ca3af;

            font-size: 14px;

            margin-bottom: 30px;
        }

        p {
            font-size: 17px;

            color: #4b5563;

            margin: 20px 0;
        }

        .back-home {
            display: inline-block;

            margin-top: 30px;

            padding: 11px 20px;

            border-radius: 999px;

            background: #4f46e5;

            color: white;

            text-decoration: none;

            font-weight: 700;
        }

        footer {
            text-align: center;

            padding: 30px 20px;

            color: #9ca3af;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            .article {
                margin: 25px auto;
            }

            .article-box {
                padding: 25px 22px;
            }

            h1 {
                font-size: 30px;
            }

            p {
                font-size: 16px;
            }

        }

    </style>

</head>

<body>

    <header class="top">

        <div class="top-inner">

            <div class="site-name">
                HYX1881 · PERSONAL WEBSITE
            </div>

            <a
                href="index.html"
                class="back">
                ← 返回首页
            </a>

        </div>

    </header>


    <main class="article">

        <article class="article-box">

            <span class="tag">
                随笔
            </span>

            <h1>
                我的第一篇文章
            </h1>

            <div class="date">
                2026年10月6日
            </div>


            <p>
                这是我的第一篇文章。
            </p>

            <p>
                从今天开始，我将在这里记录一些文字，
                分享自己的想法，也保存一些值得回忆的事情。
            </p>

            <p>
                这个网站刚刚开始建设，还有很多东西可以慢慢完善。
                我希望以后可以在这里写下自己的生活、学习、
                游戏体验以及各种有趣的事情。
            </p>

            <p>
                这是属于我自己的一个小小的互联网空间。
            </p>


            <a
                href="index.html"
                class="back-home">
                ← 返回首页
            </a>

        </article>

    </main>


    <footer>

        © 2026 HYX1881 · 我的中文网站

    </footer>

</body>

</html>
